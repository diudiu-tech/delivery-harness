spring:
  application:
    name: delivery-harness
  profiles:
    active: ${HARNESS_MODE:demo}
  datasource:
    url: ${HARNESS_DATABASE_URL:jdbc:h2:mem:harness;DB_CLOSE_DELAY=-1}
    username: ${HARNESS_DATABASE_USERNAME:sa}
    password: ${HARNESS_DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

harness:
  mode: ${HARNESS_MODE:demo}
  security:
    demo-identities: '${HARNESS_DEMO_IDENTITIES:}'
    allowed-hosts: ${HARNESS_BROWSER_ALLOWED_HOSTS:localhost,127.0.0.1,[::1]}
    allowed-origins: ${HARNESS_BROWSER_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://[::1]:8080}
    oidc:
      issuer: ${HARNESS_OIDC_ISSUER:}
      audience: ${HARNESS_OIDC_AUDIENCE:}
      jwk-set-uri: ${HARNESS_OIDC_JWK_SET_URI:}
  adapter:
    order-endpoint: ${HARNESS_ORDER_ENDPOINT:}
    allowed-hosts: ${HARNESS_ORDER_ALLOWED_HOSTS:}
    token: ${HARNESS_ORDER_TOKEN:}
  review:
    approval-threshold: ${HARNESS_REVIEW_APPROVAL_THRESHOLD:10.00}
  llm:
    allowed-hosts: ${HARNESS_LLM_ALLOWED_HOSTS:}
    default-endpoint: ${HARNESS_LLM_ENDPOINT:http://localhost:11434}
    default-model: ${HARNESS_LLM_MODEL:qwen2.5:7b}
    api-key: ${HARNESS_LLM_API_KEY:}
    timeout-seconds: ${HARNESS_LLM_TIMEOUT_SECONDS:120}
  guardrail:
    max-compensation-amount: ${HARNESS_MAX_COMPENSATION_AMOUNT:50.0}
  observe:
    max-tool-invocations: ${HARNESS_MAX_TOOL_INVOCATIONS:2000}
  eval:
    max-cases: ${HARNESS_MAX_EVAL_CASES:1000}
    max-runs: ${HARNESS_MAX_EVAL_RUNS:200}
  knowledge:
    max-documents: ${HARNESS_MAX_KNOWLEDGE_DOCUMENTS:1000}
    max-chunks: ${HARNESS_MAX_KNOWLEDGE_CHUNKS:5000}
